version: "3.9"

services:

  ollama:
    image: ollama/ollama:latest
    container_name: cognee_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  cognee:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognee_app

    depends_on:
      ollama:
        condition: service_healthy

    env_file:
      - .env

    volumes:
      - cognee_data:/app/.cognee_system
      - ./data:/app/data:ro

    restart: "no"

volumes:
  ollama_data:
  cognee_data: